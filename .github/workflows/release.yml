name: release

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      CI: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

      - name: Run lint
        run: bun run lint:CI

      - name: Run build
        run: bun run build

      - name: Pack current commit
        run: npm pack --silent

      - name: Run tests
        run: |
          PACKAGE_TGZ=$(ls list-config-plugins-*.tgz | head -n1)
          export LCP_PACKAGE="./$PACKAGE_TGZ"
          bun test --timeout 120000

      - name: Install test dependencies
        run: bun i --cwd=__tests__

      - name: Run e2e tests
        run: |
          PACKAGE_TGZ=$(ls list-config-plugins-*.tgz | head -n1)
          export LCP_PACKAGE="../$PACKAGE_TGZ"
          bun test --cwd=__tests__ --timeout 120000

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      # required for npm trusted publishing (OIDC)
      id-token: write
    env:
      NODE_ENV: production
      CI: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x

      # trusted publishing needs npm >= 11.5.1, node 22 still ships npm 10
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create release PR or publish
        id: changesets
        # v2 is required by @changesets/cli v3: the action no longer greps the
        # publish output for "New tag:" lines (v3 stopped printing them) and
        # instead reads the file the CLI writes to $CHANGESETS_OUTPUT
        uses: changesets/action@v2
        # no NPM_TOKEN on purpose: v2 never touches .npmrc, so npm authenticates
        # via OIDC trusted publishing
        with:
          # must be passed as an input; v2 errors out if GITHUB_TOKEN is set in
          # the environment instead
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun changeset version
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
