name: release

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      CI: true
      # the E2E tests run `npx <tarball>`; skip npm audit there so CI does not
      # depend on the registry's bulk-advisories endpoint latency (it has been
      # observed taking 60s+ per request, blowing the 120s test timeout)
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

      - name: Run lint
        run: bun run lint:CI

      - name: Run build
        run: bun run build

      - name: Pack current commit
        run: npm pack --silent

      - name: Run tests
        run: |
          PACKAGE_TGZ=$(ls list-config-plugins-*.tgz | head -n1)
          export LCP_PACKAGE="./$PACKAGE_TGZ"
          bun test --timeout 120000

      - name: Install test dependencies
        run: bun i --cwd=__tests__

      - name: Run e2e tests
        run: |
          PACKAGE_TGZ=$(ls list-config-plugins-*.tgz | head -n1)
          export LCP_PACKAGE="../$PACKAGE_TGZ"
          bun test --cwd=__tests__ --timeout 120000

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NODE_ENV: production
      CI: true

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.20.0

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun changeset version
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
